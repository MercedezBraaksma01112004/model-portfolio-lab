# House models: fixed holdings and weights that replace the engine's own selection for a risk profile and life stage.
#
# Source: Model_Portfolios.xlsx, "Balanced" sheet, supplied October 2026. The accumulation model was set at $200,000
# and the pension model at $600,000; the weights apply at any balance from the min_tier upwards (Core, $50,000 and up).
# Below that tier, and under the ESG screen, the engine builds the portfolio itself to the same asset allocation
# (risk_profiles.balanced in profiles.yaml), because 28 to 34 holdings cannot be implemented sensibly under $50,000
# and the house model is not screened.
#
# Weights are percentages of the portfolio and must add to 100. `ticker` is the engine's price-feed code (the
# workbook's own code is in `code`). `sleeve` is the role the model gives each holding; it is shown on the site and
# used in the basis of advice drafts. `pays` is the income frequency from the pension model.
# `inception` and `benchmark` set the live record on the dashboard (portfolio_engine/house_track.py); changing the
# holdings or weights starts a new segment of that record on the day of the change rather than restarting it.
# Deliberately not carried across: the workbook's price targets and "targeted growth return / TSR" columns. The site
# shows history, never forecasts, and a basis of advice must not rest on return expectations.
#
# How the house model is structured (the engine's own portfolios follow the same pattern; see `sizing` and the
# risk profile SAAs in profiles.yaml):
#   Accumulation, 72 growth / 28 defensive. Growth is 61% international: about 13 direct global quality and AI
#   infrastructure leaders at 2% each, two active global managers at 5% and a broad ex-US index ETF at 6%. The
#   Australian sleeve (24%) is mostly managers and LICs at 5% (two income, one small-cap growth, one activist)
#   with two direct names at 2%. Infrastructure 4% in two lines.
#   Pension, 65 growth / 35 defensive. Growth is 57% Australian: eleven high, mostly fully franked yield names at
#   2 to 3% and two income LICs at 6.5%; property 6% in three REITs; international 16% through two global LICs that
#   pay franked dividends plus Spark New Zealand; infrastructure 6%.
#   Defensive, both stages, in layers: cash at call (3.5 to 6%), a term deposit (9 to 10%), a long Commonwealth
#   bond, an absolute return bond ETF, then a credit ladder of mutual capital instruments, listed notes,
#   subordinated debt and a capital note at 2 to 3% each.

balanced_accumulation:
  label: "Balanced house model (accumulation)"
  short: "House model"
  profile: balanced
  stages: [early_accumulation, accumulation]
  min_tier: core
  model_balance: 200000
  source: "Model_Portfolios.xlsx, Balanced sheet (October 2026), accumulation column"
  # The live record (dashboard, "How the house models have done"): bought at the close on the inception date and held.
  # Benchmark: Vanguard Diversified Growth, 70% growth assets, against the model's 72%.
  inception: 2026-10-06
  benchmark: {VDGR.AX: 100}
  benchmark_label: "Vanguard Diversified Growth ETF (VDGR, 70% growth)"
  holdings:
    # Australian equities 24%
