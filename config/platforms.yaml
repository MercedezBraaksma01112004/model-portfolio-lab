# Platform fee schedules for the "Build your own portfolio" page.
#
# Each platform has account types (only super or pension so far) and, within each, its investment menus.
# Per menu:
#   tiering: marginal         each rate applies only to the slice of the balance in its band (all platforms below)
#   bands                     up_to is the top of the band in dollars (null = no upper limit), rate is a decimal a year
#   min_admin_fee / max_admin_fee   floor and cap on the tiered percentage fee
#   min_includes_fixed: true  the minimum applies to the tiered fee plus the fixed fees together (Netwealth)
#   fixed_fees                dollar fees a year per account
#   percent_fees              percentage fees on the whole balance with a dollar cap (expense recovery, ORFR levy)
#   intl_listed_rate          extra fee a year on the value of international listed securities held
#   allows_listed: false      the menu cannot hold listed shares or ETFs (managed portfolios and funds only)
#   brokerage                 Australian listed securities brokerage: rate of trade value, minimum and maximum a trade
#   verified: false           not yet checked line by line against the fee document; the page marks it "to confirm"
#
# Not modelled anywhere: the cash fee or interest retained on the cash account (it reduces the interest paid rather
# than being deducted), family group discounts, negotiated licensee rates, insurance, adviser fees, and the fees of
# the investments themselves (those are in each holding's management cost). Update a platform when its PDS changes
# and change as_of and source_url with it.

default: hub24

platforms:
  hub24:
    label: "HUB24"
    accounts:
      super:
        label: "Super or pension"
        product: "HUB24 Super"
        as_of: "PDS Part II, 18 May 2026"
        source_url: "https://my.hub24.com.au/Hub24/public/documents/documents?id=Hub24+Super+PDS"
        menus:
          discover:
            label: "Discover menu"
            tiering: marginal
            bands: [{up_to: null, rate: 0.0}]
            fixed_fees: []
            percent_fees: [{label: "Expense recovery", rate: 0.00025, cap: 350}]
            allows_listed: false
            notes: "Discover menu managed portfolios and cash only; no administration or account keeping fee. Minimum account $10,000."
          core:
            label: "Core menu"
            tiering: marginal
            bands: [{up_to: 250000, rate: 0.0036}, {up_to: 500000, rate: 0.0026}, {up_to: 1000000, rate: 0.0016}, {up_to: null, rate: 0.0006}]
            min_admin_fee: 150
            max_admin_fee: 3250
            fixed_fees: [{label: "Account keeping fee", amount: 180}]
            percent_fees: [{label: "Expense recovery", rate: 0.00025, cap: 350}]
            allows_listed: false
            notes: "Core menu managed portfolios, term deposits and cash; no direct listed securities."
          choice:
            label: "Choice menu"
            tiering: marginal
            bands: [{up_to: 250000, rate: 0.0036}, {up_to: 500000, rate: 0.0026}, {up_to: 1000000, rate: 0.0016}, {up_to: null, rate: 0.0006}]
            min_admin_fee: 350
            max_admin_fee: 3250
            fixed_fees: [{label: "Account keeping fee", amount: 360}]
            percent_fees: [{label: "Expense recovery", rate: 0.00025, cap: 350}]
            intl_listed_rate: 0.001
            allows_listed: true
            brokerage: {rate: 0.0011, min: 22}
            notes: "Full menu including Australian and international listed securities; 0.10% a year on international listed securities held. Brokerage 0.11% (minimum $11 aggregated, $22 direct market)."

  netwealth:
    label: "Netwealth"
    accounts:
      super:
        label: "Super or pension"
        product: "Netwealth Super Accelerator"
        as_of: "PDS, 1 October 2025"
        source_url: "https://www.netwealth.com.au/librarymanager/libs/41/Super-Accelerator-PDS.pdf"
        menus:
          core:
            label: "Accelerator Core"
            tiering: marginal
            bands: [{up_to: 750000, rate: 0.0015}, {up_to: null, rate: 0.0}]
            min_admin_fee: 225
            min_includes_fixed: true
            fixed_fees: [{label: "Account fee (fixed part)", amount: 60}]
            percent_fees: [{label: "ORFR levy", rate: 0.00023, cap: 300}]
            allows_listed: false
            notes: "Core holds managed funds, managed models, term deposits and annuities; no listed securities. Minimum total account fee $225 a year."
          plus:
            label: "Accelerator Plus"
            tiering: marginal
            bands: [{up_to: 250000, rate: 0.0037}, {up_to: 500000, rate: 0.0027}, {up_to: 1000000, rate: 0.0017}, {up_to: 2500000, rate: 0.0006}, {up_to: null, rate: 0.0}]
            min_admin_fee: 550
            min_includes_fixed: true
            fixed_fees: [{label: "Account fee (fixed part)", amount: 240}]
            percent_fees: [{label: "ORFR levy", rate: 0.00023, cap: 300}]
            allows_listed: true
            brokerage: {rate: 0.00125, min: 18.5}
            notes: "Plus holds Australian and international listed securities. Minimum total account fee $550 a year; a family fee rebate may apply."

  bt_panorama:
