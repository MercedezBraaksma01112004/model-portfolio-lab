            percent_fees: [{label: "Expense recovery (ORFR)", rate: 0.0001293, cap: 300}]
            allows_listed: false
            notes: "Focus holds managed funds and managed portfolios only. The asset-based fee is charged on the balance outside the transaction account."
          compact:
            label: "Compact menu"
            tiering: marginal
            bands: [{up_to: 1000000, rate: 0.0015}, {up_to: null, rate: 0.0}]
            min_admin_fee: 150
