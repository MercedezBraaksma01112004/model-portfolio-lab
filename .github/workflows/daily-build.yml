name: Daily build and publish

# Rebuilds every model portfolio from fresh prices and publishes the site. Runs on GitHub's computers, so
# nothing depends on a laptop being awake. 08:40 UTC is 18:40 in Brisbane: after the ASX close and before
# the United States open, so Australian prices are final for the day.
#
# Publishing needs no secrets: the finished site is force-pushed to the "site" branch (history discarded each
# day so the repository stays small) and Netlify, linked to this repository with "site" as its production
# branch, deploys it from there.
on:
  schedule:
    - cron: "40 8 * * 1-5"
    - cron: "0 */3 * * *"        # every three hours: rebuilds if the website has queued holding changes, or if the
                                   # weekday evening build is missing (GitHub sometimes skips scheduled runs; see the gate)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing is queued"
        default: "true"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this run needs a rebuild
        id: gate
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://model-portfolio-lab.netlify.app' }}
          EVENT: ${{ github.event_name }}
        run: |
          # Manual runs always build. Scheduled runs build when the website has queued holding changes, or when the
          # published site is older than the most recent weekday 18:30 in Brisbane. GitHub's scheduler sometimes skips
          # or delays the evening run, so any later scheduled run catches up instead of leaving the prices stale.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          site = os.environ["SITE_URL"].rstrip("/")
          def fetch(path):
              try:
                  with urllib.request.urlopen(site + path, timeout=20) as r:
                      return json.load(r)
              except Exception as e:
                  print(f"note: {path}: {e}", file=sys.stderr)
                  return None
          if os.environ.get("EVENT") != "schedule":
              print("run=true"); sys.exit(0)
          now = datetime.now(ZoneInfo("Australia/Brisbane"))
          due = now.replace(hour=18, minute=30, second=0, microsecond=0)
          if now < due:
              due -= timedelta(days=1)
          while due.weekday() >= 5:
              due -= timedelta(days=1)
          pending = len((fetch("/.netlify/functions/changes") or {}).get("pending", []))
          built = (fetch("/data/build.json") or {}).get("built_at")
          stale = not built or datetime.fromisoformat(built) < due
          print(f"pending={pending} built={built} due={due.isoformat()} stale={stale}", file=sys.stderr)
          print("run=" + ("true" if (pending or stale) else "false"))
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Restore the price and research cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/cache/prices.csv
            data/cache/research.json
            data/cache/search_index.json
          key: market-cache-${{ github.run_id }}
          restore-keys: |
            market-cache-

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          npm ci --no-audit --no-fund

      - name: Pull holding changes queued on the website
        if: steps.gate.outputs.run == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://model-portfolio-lab.netlify.app' }}
        run: |
          mkdir -p .netlify
          echo "$SITE_URL" > .netlify/site_url
          python scripts/sync_changes.py

      - name: Refresh the search index weekly
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ ! -f data/cache/search_index.json ] || [ -n "$(find data/cache/search_index.json -mtime +7 2>/dev/null)" ]; then python scripts/build_search_index.py || true; fi

      - name: Build every portfolio from fresh prices
        if: steps.gate.outputs.run == 'true'
        run: python -m portfolio_engine --refresh build

      - name: Assemble the site
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p site
          cp output/dashboard.html site/index.html
          cp output/builder.html site/builder.html
          cp output/model_portfolios_latest.xlsx site/model_portfolios_latest.xlsx
          python scripts/generate_quality_verdicts.py
          python scripts/quality_report.py > /dev/null && cp output/quality_review.html site/quality.html
          python scripts/build_listing_data.py
          # Screen every listing; apply additions and watchlist moves on Mondays only, so the models do not churn daily.
          if [ "$(date -u +%u)" = "1" ]; then python scripts/universe_scorecard.py --apply; else python scripts/universe_scorecard.py; fi
          cp config/universe_scorecard.csv site/data/universe_scorecard.csv
          # The daily brief: market numbers, announcements, regulatory and legal updates. Never fails the build.
          mkdir -p site/data
          python scripts/daily_brief.py || echo "daily brief failed; publishing the rest"
          [ -f output/brief.html ] && cp output/brief.html site/brief.html
          [ -f output/brief.json ] && cp output/brief.json site/data/brief.json
          # When this build ran and which prices it used: the gate above reads this to catch up on missed evenings.
          python3 - <<'PY'
          import glob, json, datetime, zoneinfo
          files = sorted(glob.glob("output/portfolios_*.json"))
          prices = json.load(open(files[-1])).get("as_of") if files else None
          now = datetime.datetime.now(zoneinfo.ZoneInfo("Australia/Brisbane"))
          json.dump({"built_at": now.isoformat(timespec="seconds"), "prices_as_of": prices, "run": "${{ github.run_id }}"}, open("site/data/build.json", "w"))
          print("build.json", now.isoformat(timespec="seconds"), prices)
          PY
          mkdir -p site/data && cp data/applied_changes.json site/data/applied_changes.json 2>/dev/null || echo '{"ids":[]}' > site/data/applied_changes.json
          ls -la site | head -20

      - name: Keep the engine's own records in the repository
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "portfolio-engine bot"
          git config user.email "actions@users.noreply.github.com"
          for f in config/universe.csv config/quality_review.csv config/universe_scorecard.csv data/my_holdings.csv data/cache/state.json data/applied_changes.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Daily build: holdings and tactical state as of $(date -u +%Y-%m-%d)"
          git push

      - name: Publish the site branch for Netlify
        if: steps.gate.outputs.run == 'true'
        run: |
          # A fresh, history-free branch holding only what Netlify needs: the pages, the functions and their config.
          rm -rf /tmp/publish && mkdir -p /tmp/publish
          cp -r site netlify netlify.toml package.json package-lock.json /tmp/publish/
          cd /tmp/publish
          git init -q -b site
          git config user.name "portfolio-engine bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(date -u +%Y-%m-%dT%H:%M)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site:site
          echo "published branch 'site' (Netlify deploys it)"
